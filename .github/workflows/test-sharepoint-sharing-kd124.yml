name: Controlled SharePoint sharing test KD124

on:
  push:
    branches:
      - test/sharepoint-sharing-kd124-20260921
    paths:
      - .github/workflows/test-sharepoint-sharing-kd124.yml

permissions:
  contents: read

jobs:
  test-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sharepoint-production
    env:
      SITE_URL: https://webscoutsteams.sharepoint.com/sites/KD124
      SHAREPOINT_ADMIN_URL: https://webscoutsteams-admin.sharepoint.com
      SHAREPOINT_TENANT: ${{ secrets.SHAREPOINT_TENANT }}
      SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
      SHAREPOINT_CERTIFICATE_BASE64: ${{ secrets.SHAREPOINT_CERTIFICATE_BASE64 }}
      SHAREPOINT_CERTIFICATE_PASSWORD: ${{ secrets.SHAREPOINT_CERTIFICATE_PASSWORD }}
      CALLBACK_TOKEN: ${{ secrets.N8N_SHAREPOINT_CALLBACK_TOKEN }}

    steps:
      - name: Validate protected environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'SHAREPOINT_TENANT',
            'SHAREPOINT_CLIENT_ID',
            'SHAREPOINT_CERTIFICATE_BASE64',
            'SHAREPOINT_CERTIFICATE_PASSWORD',
            'CALLBACK_TOKEN'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required protected environment secret is missing: $name"
            }
          }

      - name: Verify n8n callback authentication
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $payload = @{
            requestId = 'sp-recEHjbbKipSXfj30-11111111-1111-4111-8111-111111111111'
            siteUrl   = $env:SITE_URL
            status    = 'success'
            runUrl    = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Compress

          $headers = @{
            Authorization = "Bearer $env:CALLBACK_TOKEN"
            Accept = 'application/json'
          }

          $response = Invoke-WebRequest -Uri 'https://automation.schulzemarketing.de/webhook/schulze-v2-sharepoint-sharing-callback' -Method POST -Headers $headers -ContentType 'application/json' -Body $payload -SkipHttpErrorCheck

          if ([int]$response.StatusCode -ne 409) {
            throw "Expected authenticated callback to reach correlation validation and return HTTP 409, received HTTP $([int]$response.StatusCode)."
          }

          Write-Host 'Callback authentication accepted; correlation rejected as expected for the controlled probe.'

      - name: Install PnP PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PnP.PowerShell -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop

      - name: Enable and verify external sharing on KD124
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certPath = Join-Path $env:RUNNER_TEMP 'schulze-sharepoint-test.pfx'
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:SHAREPOINT_CERTIFICATE_BASE64))
            $certificatePassword = ConvertTo-SecureString $env:SHAREPOINT_CERTIFICATE_PASSWORD -AsPlainText -Force

            Connect-PnPOnline -Url $env:SHAREPOINT_ADMIN_URL -ClientId $env:SHAREPOINT_CLIENT_ID -Tenant $env:SHAREPOINT_TENANT -CertificatePath $certPath -CertificatePassword $certificatePassword

            try {
              $before = Get-PnPTenantSite -Identity $env:SITE_URL -ErrorAction Stop
            }
            catch {
              throw "SharePoint tenant-site access was rejected. Verify the Entra app has SharePoint (not Microsoft Graph) application permission Sites.FullControl.All, admin consent is granted, and the certificate uploaded to the app matches the GitHub PFX secret. Original error: $($_.Exception.Message)"
            }

            Write-Host ("Before: " + [string]$before.SharingCapability)

            Set-PnPTenantSite -Identity $env:SITE_URL -SharingCapability ExternalUserSharingOnly

            $verified = $false
            for ($attempt = 1; $attempt -le 12; $attempt++) {
              $site = Get-PnPTenantSite -Identity $env:SITE_URL
              Write-Host ("Verification attempt " + $attempt + ": " + [string]$site.SharingCapability)
              if ([string]$site.SharingCapability -eq 'ExternalUserSharingOnly') {
                $verified = $true
                break
              }
              Start-Sleep -Seconds 10
            }

            if (-not $verified) {
              throw "SharePoint did not report ExternalUserSharingOnly after verification retries."
            }
          }
          finally {
            Disconnect-PnPOnline -ErrorAction SilentlyContinue
            if (Test-Path $certPath) {
              Remove-Item $certPath -Force -ErrorAction SilentlyContinue
            }
          }
